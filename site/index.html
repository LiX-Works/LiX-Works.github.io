<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiX · Agents for research, researcher in charge</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Open-source AI-agent tools for scientific research, live physics demos, and an interactive periodic table of the techniques behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f6;--tile:#fff;--line:rgba(17,19,22,.08);--ink:#0d1626;--ink2:#3c4757;--muted:#7a8698;--accent:#1f4fd1;--accent-soft:#dfe8fb;
  --human:#b45309;--human-soft:#fff1de;--hum-bg:#0e1b36;--hum-fg:#c9d6ee;--hum-acc:#f2a541;--hero1:#ffffff;--hero2:#e6edf6;--toy1:#fbfcfe;--toy2:#e8eef7;
  --sans:"Inter Tight",Inter,system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.page{max-width:1380px;margin:0 auto;padding:22px 28px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 22px}
.top .mark{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}
.top .mark b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font:600 13px var(--mono)}
.top a.gh{font-weight:650;font-size:14px;padding:10px 15px;border-radius:12px;background:var(--ink);color:#fff}

/* ---------- bento cards ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:72px;gap:14px}
.t{position:relative;background:var(--tile);border-radius:26px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s, opacity .6s;opacity:0;transform:translateY(16px)}
.t.in{opacity:1;transform:none}
a.t:hover{transform:translateY(-4px);box-shadow:0 30px 60px -40px rgba(17,19,22,.55)}
a.t:hover .fig img{transform:scale(1.025)}
.stretched-link::after{content:"";position:absolute;inset:0;z-index:2;cursor:pointer;border-radius:inherit}
.stretched-link:focus-visible{outline:none}
.stretched-link:focus-visible::after{outline:3px solid var(--accent);outline-offset:-4px}
.live-t:has(.stretched-link):hover{box-shadow:0 30px 60px -40px rgba(17,19,22,.55)}
/* Keep independent playback buttons above the card link. Activating the live
   interaction deliberately hands the preview area back to its iframe. */
.live-t .live{isolation:auto}
.live-t .live.is-active{z-index:3}
.t .pad{padding:24px 26px}
.t small{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t h3{margin:8px 0 6px;font-size:23px;letter-spacing:-.02em;line-height:1.15}
.t p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.t .fig{flex:1;min-height:0;position:relative;border-top:1px solid var(--line);background:#fff}
.t .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.t .arrow{position:absolute;right:20px;top:20px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:15px;transition:all .3s}
a.t:hover .arrow{background:var(--ink);color:#fff}
.t .hu{margin-top:10px;font-size:13.5px;font-weight:650;color:var(--human)}
.bd{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:3px;margin-left:6px}

.showcase{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-auto-rows:350px;gap:14px;margin-bottom:14px}
.hero{padding:28px;justify-content:center;background:radial-gradient(120% 120% at 0% 0%,var(--hero1) 0%,var(--hero2) 100%)}
.hero h1{font-size:clamp(34px,3.4vw,48px);line-height:1.03;letter-spacing:-.03em;margin:0;font-weight:700}
.hero h1 em{display:block;margin-top:6px;font-family:var(--serif);font-weight:400;font-style:italic;color:var(--accent);letter-spacing:-.01em}

.live-t{grid-row:span 4}
.live-t .live{flex:1;min-height:0;background:#e9f0f6}
.live-t .cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line)}
.live-t .cap b{font-size:17px}.live-t .cap span{display:block;font-size:14px;color:var(--muted)}
.live-t .cap a{flex:none;font-size:13.5px;font-weight:650;padding:8px 12px;border-radius:10px;background:var(--bg)}
.s7{grid-column:span 7}.s5{grid-column:span 5}
.r4{grid-row:span 5}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.hum{background:var(--hum-bg);color:var(--hum-fg);border-color:var(--hum-bg);justify-content:space-between}
.hum small{color:var(--hum-acc);opacity:.85}
.hum blockquote{margin:14px 0 0;font-family:var(--serif);font-size:36px;line-height:1.05;letter-spacing:-.01em;color:#fff}
.hum blockquote em{color:var(--hum-acc)}
.hum p{color:var(--hum-fg)}
.hum .figp{display:flex;gap:8px;margin-top:16px}
.hum .figp i{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--hum-acc);position:relative}
.hum .figp i::before{content:"";position:absolute;left:50%;top:6px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--hum-acc)}
.hum .figp i::after{content:"";position:absolute;left:50%;bottom:5px;width:16px;height:8px;margin-left:-8px;border-radius:8px 8px 3px 3px;background:var(--hum-acc)}
.hum .figp i.o{border-style:dashed;opacity:.8}
.dark{background:#0f1217;color:#e6eaf0;border-color:#0f1217}
.dark small{color:#8a94a2}.dark p{color:#b7c0cc}.dark .fig{background:#0f1217;border-top-color:rgba(255,255,255,.08)}.dark .arrow{background:rgba(255,255,255,.08)}
.gal{position:absolute;inset:0}
.gal img{opacity:0;transition:opacity 1s}.gal img.on{opacity:1}
.gh-t{background:var(--ink);color:#fff;border-color:var(--ink);justify-content:space-between}
.gh-t small{color:#9aa1aa}.gh-t p{color:#c9ced5}
.gh-t .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:10px}
.gh-t .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 16px;border-radius:12px;background:#fff;color:var(--ink);font-weight:700;font-size:15px;width:max-content}
.foot{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between;padding:26px 6px 0;font-size:14.5px;color:var(--muted)}
.foot a{color:var(--ink2);font-weight:600}

/* ---------- static 31-element preview ---------- */
.toy{cursor:pointer;background:radial-gradient(70% 60% at 42% 58%,#1a2f5c 0%,#0f1d3d 45%,#08112a 100%);color:#f2f6ff;isolation:isolate}
.toy-head{position:absolute;left:24%;right:22%;top:36px;z-index:2;pointer-events:none}
.toy-head h2{margin:0;font-size:clamp(27px,2.45vw,35px);line-height:1.02;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.toy-head h2 em{font-family:var(--serif);font-weight:400;font-style:italic;color:#a9c4ff}
.preview-frame{position:absolute;inset:0;perspective:2000px;perspective-origin:50% 0%;pointer-events:none;-webkit-mask-image:linear-gradient(#000 78%,transparent 103%);mask-image:linear-gradient(#000 78%,transparent 103%)}
.preview-grid{position:absolute;left:8%;top:48px;width:84%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) .36fr repeat(4,minmax(0,1fr));gap:8px;transform:rotateX(38deg) rotateZ(7deg);transform-origin:50% 0%;transform-style:preserve-3d}
.preview-zone{grid-row:1;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid currentColor}
.preview-zone.tech{grid-column:1/3;color:#79a8ff}.preview-zone.proj{grid-column:7/11;color:#ffbe4d}
.preview-element{position:relative;aspect-ratio:1/.92;--f:rgba(96,150,255,.17);--b:rgba(140,182,255,.78);--t:#d6e5ff}
.preview-element.p{--f:rgba(255,186,72,.16);--b:rgba(255,204,110,.80);--t:#ffe2a3}
.preview-element .face{position:absolute;inset:0;border-radius:6px;transform:translateZ(3px);background:linear-gradient(170deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 38%,rgba(0,0,0,.10)),var(--f);border:1.5px solid var(--b);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 22px -14px rgba(0,0,0,.8);display:flex;align-items:center;padding:0 9%;font:700 30px/1 var(--sans);letter-spacing:-.02em;color:var(--t)}
.preview-element.building .face{border-style:dashed}
.preview-cta{position:absolute;right:22px;bottom:20px;z-index:3;display:inline-flex;align-items:center;gap:10px;padding:9px 13px;border-radius:99px;border:1px solid rgba(140,182,255,.5);background:rgba(8,17,42,.9);color:#d6e5ff;font-size:15px;font-weight:600;box-shadow:0 0 22px -12px #79a8ff}
.preview-cta i{font-style:normal;color:#ffce75;font-size:18px}
.toy:hover .preview-cta{border-color:#a9c4ff;background:rgba(34,62,115,.8)}
.toy:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

@media (max-width:1100px){.showcase{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}.hero{padding:22px}.hero h1{font-size:38px}.toy-head{top:38px;left:25%;right:13%}.toy-head h2{font-size:28px}.s7,.s5{grid-column:span 12}.c3,.c4,.c5{grid-column:span 6}.bento{grid-auto-rows:auto}.t{min-height:0}.live-t{min-height:300px}.r4{min-height:400px}}
@media (max-width:800px){.showcase{grid-template-columns:1fr;grid-template-rows:350px auto;grid-auto-rows:auto}.hero{padding:24px 28px}.hero h1{font-size:38px}.hero h1 .break{display:none}.hero h1 em{display:block;margin-top:4px}}
@media (max-width:680px){
  .page{padding:14px 12px 30px}.bento{gap:10px}.c3,.c4,.c5{grid-column:span 12}.showcase{grid-template-rows:320px auto;gap:10px;margin-bottom:10px}.hero{padding:22px 24px}.hero h1{font-size:34px}.toy-head{left:25%;right:10%;top:28px}.toy-head h2{font-size:26px}.preview-grid{width:102%;left:1%;top:64px;gap:6px}.preview-zone{visibility:hidden}.preview-element .face{font-size:27px}.preview-cta{right:16px;bottom:16px;font-size:14px}
}
/* Preserve content motion and deliberate press feedback in either preference.
   Reduce decorative entrances and pulses; pointer tilt is reduced in the script. */
@media (prefers-reduced-motion:reduce){
  .t{opacity:1;transform:none;transition:none}
}

/* ---------- preview, second pass: title left, the whole table on the right, the call to action in the table's top gap ---------- */
.showcase{grid-template-columns:minmax(0,2.5fr) minmax(0,1fr);grid-auto-rows:350px}
.hero{padding:24px 26px}
.hero h1{font-size:clamp(28px,2.45vw,38px)}
.toy{background:radial-gradient(75% 70% at 62% 55%,#142650 0%,#0e1c3e 50%,#08112a 100%)}
.toy::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(160,195,255,.24) 1px,transparent 1.6px) 0 0/24px 24px;
  -webkit-mask-image:radial-gradient(70% 80% at 64% 52%,#000 30%,transparent 100%);mask-image:radial-gradient(70% 80% at 64% 52%,#000 30%,transparent 100%)}
.toy-head{left:34px;right:auto;top:50%;width:36%;transform:translateY(-50%)}
.toy-head h2{font-size:clamp(30px,2.95vw,44px);line-height:1.04}
/* the table runs off the bottom edge and fades out around the fourth row */
.preview-frame{-webkit-mask-image:linear-gradient(#000 62%,transparent 98%);mask-image:linear-gradient(#000 62%,transparent 98%);perspective:1800px;perspective-origin:70% 10%}
.preview-grid{left:40%;top:30px;width:58%;gap:8px;transform:rotateX(30deg) rotateZ(5deg);transform-origin:50% 0}
.preview-zone.tech{grid-column:1/6}
.preview-element .face{justify-content:center;padding:0;font:700 clamp(16px,1.65vw,25px)/1 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:0;
  background:linear-gradient(170deg,rgba(255,255,255,.11),rgba(255,255,255,.02) 38%,rgba(0,0,0,.14)),linear-gradient(var(--f),var(--f)),#0f1c3b}
.preview-cta{display:none}
.preview-gap{grid-row:2/4;grid-column:3/10;display:flex;align-items:center;justify-content:center;transform:translateZ(2px)}
.preview-gap span{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:99px;border:1px solid rgba(140,182,255,.6);background:rgba(8,17,42,.82);
  color:#e4ecff;font-size:clamp(13px,1.05vw,15px);font-weight:600;white-space:nowrap;box-shadow:0 0 24px -10px #79a8ff}
.preview-gap i{font-style:normal;color:#ffce75}
.toy:hover .preview-gap span{border-color:#cfe0ff;background:rgba(34,62,115,.88)}
@media (max-width:1100px){.showcase{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
  .toy-head{left:26px;width:34%}.toy-head h2{font-size:30px}.preview-grid{left:38%;width:58%}}
/* stacked: title on top, the table below it */
@media (max-width:800px){.showcase{grid-template-rows:350px auto}
  .toy-head{left:24px;right:24px;width:auto;top:22px;transform:none}.toy-head h2{font-size:30px}.toy-head h2 br{display:none}
  .preview-grid{left:21%;width:58%;top:96px}}
@media (max-width:680px){.showcase{grid-template-rows:330px auto}
  .toy-head{top:18px}.toy-head h2{font-size:24px}
  .preview-grid{left:3%;width:94%;top:92px;gap:5px}.preview-element .face{font-size:14px;border-radius:4px}
  .preview-gap span{padding:5px 10px;font-size:12px}}
</style>
</head>
<body>
<div class="page">
  <header class="top"><div class="mark"><b>LX</b>LiX</div><a class="gh" href="https://github.com/LiX-Works">GitHub ↗</a></header>
  <div class="showcase">
    <a class="t toy" id="toy" href="elements.html" aria-label="Open the interactive periodic table">
      <div class="toy-head"><h2>A <em>periodic table</em><br>of my AI toolkit</h2></div>

"Loop Engineering" style="grid-row:5;grid-column:3"><span class="face">Lu</span></span><span class="preview-element" data-s="B" title="Blender" style="grid-row:5;grid-column:4"><span class="face">B</span></span><span class="preview-element" data-s="Co" title="COMSOL" style="grid-row:5;grid-column:5"><span class="face">Co</span></span><span class="preview-element p" data-s="As" title="Search Booster" style="grid-row:5;grid-column:7"><span class="face">As</span></span><span class="preview-element p" data-s="Sm" title="Subagent Manager" style="grid-row:5;grid-column:8"><span class="face">Sm</span></span><span class="preview-element p building" data-s="Sr" title="Research Loop" style="grid-row:5;grid-column:9"><span class="face">Sr</span></span><span class="preview-element" data-s="Sb" title="Subagents" style="grid-row:6;grid-column:1"><span class="face">Sb</span></span><span class="preview-element" data-s="P" title="Python" style="grid-row:6;grid-column:2"><span class="face">P</span></span><span class="preview-element" data-s="Re" title="Remotion" style="grid-row:6;grid-column:3"><span class="face">Re</span></span><span class="preview-element" data-s="Th" title="Three.js" style="grid-row:6;grid-column:4"><span class="face">Th</span></span><span class="preview-element" data-s="N" title="Node.js" style="grid-row:6;grid-column:5"><span class="face">N</span></span><span class="preview-element p" data-s="K" title="KSA Languages" style="grid-row:6;grid-column:7"><span class="face">K</span></span><span class="preview-element p" data-s="Cd" title="Codex Translate" style="grid-row:6;grid-column:8"><span class="face">Cd</span></span><span class="preview-element" data-s="Cl" title="CLI" style="grid-row:7;grid-column:1"><span class="face">Cl</span></span><span class="preview-element" data-s="He" title="HTML / CSS" style="grid-row:7;grid-column:2"><span class="face">He</span></span><span class="preview-element" data-s="Sc" title="JavaScript" style="grid-row:7;grid-column:3"><span class="face">Sc</span></span><span class="preview-element" data-s="Ts" title="TypeScript" style="grid-row:7;grid-column:4"><span class="face">Ts</span></span><span class="preview-element" data-s="W" title="WebGL2" style="grid-row:7;grid-column:5"><span class="face">W</span></span></div></div>
      <span class="preview-cta"><i aria-hidden="true">↗</i>Click to explore</span>
    </a>
    <section class="t hero">
      <h1>Agents do<span class="break"><br></span> the legwork.<em>The researcher<span class="break"><br></span> decides.</em></h1>
    </section>
  </div>
  <div class="bento" id="bento"></div>
  <div class="foot" id="foot"></div>
</div>


<script src="shared/content.js"></script>
<script src="shared/live/embed.js?v=20261026-motion1"></script>
<script>
const H = window.HUB, P = H.byId, FIG = 'shared/fig/';

/* ---------- the cards ---------- */
const tile = (id, cls, extra = {}) => {
  const p = P[id];
  return `<a class="t ${cls}${extra.dark ? ' dark' : ''}" href="${p.repo}" data-p="${id}">
    <div class="pad"><small>${H.groups[p.group].name}</small><h3>${p.name}${p.status ? `<span class="bd">${p.status}</span>` : ''}</h3><p>${p.line}</p>${p.human && extra.hum ? `<div class="hu">● ${p.human}</div>` : ''}</div>
    <div class="fig">${extra.gallery ? `<div class="gal">${extra.gallery.map((g, i) => `<img src="${FIG + g}" alt="" class="${i ? '' : 'on'}">`).join('')}</div>` : `<img src="${FIG + (extra.fig || p.fig)}" alt="${p.name} figure" loading="lazy">`}</div>
    <span class="arrow">↗</span></a>`;
};
document.getElementById('bento').insertAdjacentHTML('beforeend', `
  <section class="t live-t s7" id="demos"><div class="live" data-live="proxitouch" data-chart="off" data-badge-pos="bl"></div>
    <div class="cap"><div><b>ProxiTouch · interactive 3D lesson</b><span>One electrode senses approach, touch and press, on two channels. Part of two lessons on capacitive sensing.</span></div><a class="stretched-link" href="${P.capacitance.site}">Open the lessons ↗</a></div></section>
  <section class="t live-t s5"><div class="live" data-live="edl" data-mode="video" data-fx="0.08"></div>
    <div class="cap"><div><b>EDL gating · rendered from code</b><span>A thin dielectric under high field breaks down.</span></div><a class="stretched-link" href="${P.animation.site}">Full film ↗</a></div></section>
  ${tile('comsol', 'c5 r4', { hum: true })}
  ${tile('scholarfetch', 'c4 r4', { hum: true })}
  <section class="t c3 r4 hum"><div class="pad"><small>Human-in-the-Loop</small><blockquote>Agents draft.<br><em>A researcher decides.</em></blockquote><div class="figp"><i></i><i></i><i class="o"></i></div></div>
    <div class="pad" style="padding-top:0"><p>Every tool stops at checkpoints, solid for required reviews and dashed for optional ones, where a person checks the evidence.</p></div></section>
  ${tile('origin', 'c4 r4', { gallery: P.origin.gallery, hum: true })}
  ${tile('autocite', 'c4 r4', { hum: true })}
  ${tile('loop', 'c4 r4', { hum: true })}
  ${tile('search', 'c4 r4')}
  ${tile('subagent', 'c4 r4')}
  <a class="t c4 r4 gh-t" href="${H.github}?tab=repositories"><div class="pad"><small>All open source</small><div class="big">Every project lives on GitHub.</div><p style="margin-top:12px">${H.githubLine}</p><span class="go">View all repositories ↗</span></div></a>`);
document.getElementById('foot').innerHTML = `<span>Also built: ${H.projects.filter(p => p.group === 'side').map(p => `<a href="${p.repo}">${p.name}</a>`).join(' · ')}</span><span><a href="https://github.com/LiX-Works/LiX-Works.github.io/blob/main/THIRD_PARTY_NOTICES.md">Credits</a> · © LiX</span>`;
setInterval(() => document.querySelectorAll('.gal').forEach(g => { const im = [...g.children], i = im.findIndex(x => x.classList.contains('on')); im[i].classList.remove('on'); im[(i + 1) % im.length].classList.add('on'); }), 2600);
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -5% 0px' });
document.querySelectorAll('.t').forEach(t => io.observe(t));

// Keep existing links to the table working after the move to its own page.
if (location.hash === '#elements') location.replace('elements.html');
</script>
</body>
</html>
